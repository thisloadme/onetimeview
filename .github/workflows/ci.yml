# P3.2: GitHub Actions — Lint → Build → Docker
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: onetimeview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (TS)
        run: npx nuxi typecheck || echo "⚠️ Type check issues found (non-blocking)"

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/onetimeview_test

      - name: Run Prisma migration
        run: npx prisma migrate dev --name ci
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/onetimeview_test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/onetimeview_test
          NUXT_JWT_SECRET: ci-test-secret-do-not-use

  docker:
    needs: lint-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: onetimeview:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
